<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Productivité - Pastel Aesthetic</title>
    <style>
        /* --- VARIABLES DE COULEURS (Inspirées des captures) --- */
        :root {
            --sidebar-bg: #ff758c;          /* Rose vif de la barre latérale */
            --sidebar-icon-active: #ffffff;  /* Blanc pour l'élément actif */
            --sidebar-icon: rgba(255, 255, 255, 0.7);
            --main-bg: #fff5f7;            /* Fond général très léger rose/crème */
            --panel-bg: #ffffff;           /* Fond des blocs / cartes */
            --text-main: #2d3142;          /* Texte principal sombre */
            --text-muted: #9a9ea6;         /* Texte secondaire / gris */
            
            /* Couleurs pastel pour les blocs / tâches */
            --pastel-blue: #c4d7ed;
            --pastel-pink: #f5d6ce;
            --pastel-green: #d0e1d4;
            --pastel-purple: #e2d9f3;
            --pastel-peach: #fae1dd;
            
            --border-color: #f0f0f2;
        }

        /* --- MISE EN PAGE GÉNÉRALE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- BARRE LATÉRALE (Sidebar rose) --- */
        aside {
            width: 70px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            justify-content: space-between;
        }

        .sidebar-top, .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sidebar-icon);
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1.1rem;
        }

        .nav-icon.active {
            background-color: rgba(255, 255, 255, 0.25);
            color: var(--sidebar-icon-active);
        }

        .nav-icon:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: var(--sidebar-icon-active);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffd3d9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.03);
            margin-top: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        /* En-tête */
        header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .header-actions button {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .header-actions button:hover {
            background: var(--main-bg);
        }

        /* --- CONTENU DU TABLEAU DE BORD (Grille / Agenda) --- */
        .dashboard-content {
            flex: 1;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            overflow-y: auto;
        }

        /* Styles des cartes pastel (façon événements d'agenda ou blocs de tâches) */
        .card {
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Variantes de couleurs pastel pour les cartes */
        .card.blue { background-color: var(--pastel-blue); color: #23426b; }
        .card.pink { background-color: var(--pastel-pink); color: #6b342e; }
        .card.green { background-color: var(--pastel-green); color: #27442d; }
        .card.purple { background-color: var(--pastel-purple); color: #433361; }
        .card.peach { background-color: var(--pastel-peach); color: #633c38; }

        /* Style des cases à cocher miniatures */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            accent-color: currentColor;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Barre latérale rose -->
    <aside>
        <div class="sidebar-top">
            <div class="user-avatar">A</div>
            <div class="nav-icon active">📅</div>
            <div class="nav-icon">☑️</div>
            <div class="nav-icon">🍅</div>
            <div class="nav-icon">📊</div>
        </div>
        <div class="sidebar-bottom">
            <div class="nav-icon">⚙️</div>
        </div>
    </aside>

    <!-- Zone principale -->
    <main>
        <header>
            <h1>septembre</h1>
            <div class="header-actions">
                <button>Aujourd'hui</button>
            </div>
        </header>

        <!-- Grille de cartes / tâches -->
        <div class="dashboard-content">
            
            <div class="card blue">
                <div>
                    <div class="card-header">
                        <span class="checkbox-container">
                            <input type="checkbox" checked> Planning a video
                        </span>
                    </div>
                </div>
                <div class="card-time">8:30 - 9:30</div>
            </div>

            <div class="card peach">
                <div>
                    <div class="card-header">
                        <span class="checkbox-container">
                            <input type="checkbox"> Jogging
                        </span>
                    </div>
                </div>
                <div class="card-time">8:00 - 9:00</div>
            </div>

            <div class="card green">
                <div>
                    <div class="card-header">
                        <span class="checkbox-container">
                            <input type="checkbox"> Hiking
                        </span>
                    </div>
                </div>
                <div class="card-time">8:30 - 12:00</div>
            </div>

            <div class="card pink">
                <div>
                    <div class="card-header">
                        <span class="checkbox-container">
                            <input type="checkbox"> Department training
                        </span>
                    </div>
                </div>
                <div class="card-time">9:00 - 12:00</div>
            </div>

            <div class="card purple">
                <div>
                    <div class="card-header">
                        <span class="checkbox-container">
                            <input type="checkbox" checked> Pruning garden
                        </span>
                    </div>
                </div>
                <div class="card-time">7:00 - 8:00</div>
            </div>

            <div class="card blue">
                <div>
                    <div class="card-header">
                        <span class="checkbox-container">
                            <input type="checkbox"> Online meeting
                        </span>
                    </div>
                </div>
                <div class="card-time">8:00 - 10:00</div>
            </div>

        </div>
    </main>

</body>
</html>
